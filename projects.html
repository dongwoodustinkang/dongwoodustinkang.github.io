<body class="site-shell works-page">

  <div id="site-navigation"></div>

  <main class="projects-main">
    <section class="projects-page-section" aria-labelledby="works-title">
      <div class="projects-page-head">
        <h1 id="works-title" data-en="Projects">프로젝트</h1>
        <div class="projects-filters" role="group" aria-label="Project filters">
          <label class="projects-filter-wrap" for="projects-year-filter">
            <span class="sr-only" data-en="Filter projects by year">연도별 필터</span>
            <select id="projects-year-filter" class="projects-filter-select projects-filter-year">
              <option value="all">Year</option>
            </select>
          </label>

          <label class="projects-filter-wrap" for="projects-filter">
            <span class="sr-only" data-en="Filter projects by category">분야별 필터</span>
            <select id="projects-filter" class="projects-filter-select">
              <option value="all">Projects</option>
            </select>
          </label>
        </div>
      </div>
      <div id="projects-list" class="projects-list" aria-live="polite"></div>
    </section>
  </main>
